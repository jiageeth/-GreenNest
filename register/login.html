        GreenNest

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link" href="../Home/1st.html">Home</a></li>

  <section class="register-section">
    <div class="container">
      <div class="page-header">
        <h1>Sign In</h1>
        <p>Welcome back to GreenNest.</p>
      </div>

      <div class="register-card">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Your password" required />
          </div>
          <button type="submit" class="btn-create-account">Sign In</button>
        </form>
        <div class="signin-link">
          Don't have an account? <a href="index.html">Register</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert('Login would connect to your backend.');
    }
  </script>
