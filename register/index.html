  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="../Home/1st.html">
        <img src="https://cdn-icons-png.flaticon.com/512/765/765430.png" width="30" height="30" class="me-2" alt="GreenNest Logo">
        GreenNest
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link" href="../Home/1st.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../browse/index.html">Browse Plants</a></li>
          <li class="nav-item"><a class="nav-link" href="../blog/index.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="../plant _care_assistent/index.html">Plant Care</a></li>
          <li class="nav-item"><a class="nav-link" href="../cart/index.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="../login-page/login.html">Login</a></li>
          <li class="nav-item">
            <a class="btn btn-register ms-2" href="index.html">Register</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="../dashboard/index.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- REGISTER PAGE CONTENT -->
  <section class="register-section">
    <div class="container">
      <div class="page-header">
        <h1>Create Account</h1>
        <p>Join GreenNest to shop plants, save favorites, and get care tips.</p>
      </div>

      <div class="register-card">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password (min 8 characters)"
              required
              minlength="8"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
              minlength="8"
            />
          </div>

          <button type="submit" class="btn-create-account">Create Account</button>
        </form>

        <div class="signin-link">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
